    # Конструктор фото для Алины — вставлено в /etc/nginx/sites-available/kvity (блок server с 443).
    # ^~ нужно, чтобы правило для картинок (*.jpg, *.webp) не перехватывало /foto/img/...
    location = /foto { return 301 /foto/; }
    location ^~ /foto/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

